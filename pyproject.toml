[tool.poetry]
name = "tu2090-python-rekor-monitor"
version = "4.0.0"
description = "A Python client for verifying Rekor transparency log entries"
authors = ["tu2090 <tu2090@nyu.edu>"]
readme = "README.md"
license = "MIT"
packages = [{include = "tu2090_python_rekor_monitor", from = "src"}]
keywords = ["rekor", "sigstore", "transparency-log", "merkle-tree", "supply-chain-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
cryptography = "^41.0.0"
pyjwt = "^2.8.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.0"
black = "^23.0.0"
ruff = "^0.0.280"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
safety = "^2.3.0"
flake8 = "^7.3.0"
pylint = "^4.0.2"
bandit = "^1.8.6"
coverage = "^7.11.0"
types-requests = "^2.32.4.20250913"

[tool.poetry.scripts]
tu2090-python-rekor-monitor = "tu2090_python_rekor_monitor.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E402", "W503"]
exclude = [".git", "__pycache__", "dist", "build", ".venv"]