name: Continuous Deployment

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-in-project: true
        
    - name: Install dependencies
      run: poetry install --no-interaction
      
    - name: Build package
      run: poetry build
      
    - name: Generate SBOM with poetry export
      run: |
        poetry export -f requirements.txt --output requirements.txt --all-extras
        
    - name: Install cyclonedx-py for SBOM generation
      run: pip install cyclonedx-py
      
    - name: Generate SBOM
      run: |
        cyclonedx-py -o sbom.json --format json requirements.txt
        cyclonedx-py -o sbom.xml --format xml requirements.txt
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: dist/
        
    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: |
          sbom.json
          sbom.xml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: dist/
        
    - name: Download SBOM artifacts
      uses: actions/download-artifact@v4
      with:
        name: sbom
        path: ./
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body: |
          ## Release ${{ github.ref_name }}
          
          ### Artifacts
          - **dist/*.whl** - Python wheel distribution
          - **dist/*.tar.gz** - Source distribution
          - **sbom.json** - Software Bill of Materials (JSON format)
          - **sbom.xml** - Software Bill of Materials (XML format)
          
          ### Security & Compliance
          This release includes:
          - Automated build and packaging
          - SBOM generation for supply chain visibility
          - Secure attestations for provenance
          
          **Release Date:** ${{ github.event.head_commit.timestamp }}
          **Commit:** ${{ github.sha }}
        files: |
          dist/*.whl
          dist/*.tar.gz
          sbom.json
          sbom.xml
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}